- Nazywam się Dagmara Piotrowska. Prowadzę psychoterapię w obszarze zdrowia psychicznego,
  wspierając osoby w odzyskiwaniu zdrowia, poprawie samopoczucia i codziennego funkcjonowania.
  Pomagam osobom doświadczającym stresu, napięcia, obniżonego nastroju, kryzysów życiowych
  oraz trudności w relacjach i poczuciu własnej wartości.
- Pracuję również z osobami z rozpoznanymi zaburzeniami osobowości, zaburzeniami odżywiania
  oraz innymi diagnozami dotyczącymi zdrowia psychicznego. Diagnoza jest ważną informacją,
  która pomaga rozumieć trudności, ale nie określa tego, kim jesteś. W naszej pracy
  uwzględniam Twoje doświadczenia, potrzeby, mocne strony i to, jakiej zmiany pragniesz
  w swoim życiu.
- Pracuję w podejściu skoncentrowanym na rozwiązaniach — TSR. Wspólnie przyglądamy
  się temu, co jest dla Ciebie ważne, co chcesz zmienić oraz jakie doświadczenia i
  umiejętności mogą wspierać proces zdrowienia. Ustalamy cele i szukamy możliwych
  kroków, dopasowanych do Twojej sytuacji i tempa.
- Zależy mi na atmosferze akceptacji, uważności i szacunku. Nie musisz przychodzić
  z gotowymi odpowiedziami ani dokładnie wiedzieć, od czego zacząć. Pierwsze spotkanie
  jest przestrzenią do rozmowy o Twoich potrzebach i ustalenia dalszej współpracy.
  Prowadzę spotkania indywidualne, z parami oraz rodzinami — w Gdańsku i online.
- Jestem psychoterapeutką TSR w procesie certyfikacji. Ukończyłam szkolenie w Podejściu
  Skoncentrowanym na Rozwiązaniach i posiadam certyfikat Konsultanta TSR (nr K/043).
  Rozwijam swoje kompetencje poprzez dodatkowe szkolenia, m.in. dotyczące pracy z
  parami, młodzieżą oraz osobami doświadczającymi trudności emocjonalnych.
- Jestem również dyplomowaną psychodietetyczką, absolwentką studiów podyplomowych
  na Uniwersytecie SWPS. W ramach konsultacji psychodietetycznych wspieram osoby,
  które chcą przyjrzeć się swojej relacji z jedzeniem i ciałem.
